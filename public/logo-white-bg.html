<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Green Electric Logo - White Background</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

    body {
      margin: 0;
      padding: 40px;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .logo-container {
      background: white;
      padding: 40px 60px;
      display: inline-block;
    }

    .logo {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: left;
    }

    .main-title {
      font-size: 48px;
      font-weight: 700;
      color: #22c55e;
      margin: 0;
      line-height: 1.1;
      display: flex;
      align-items: flex-start;
    }

    .registered {
      font-size: 14px;
      margin-left: 4px;
      margin-top: 4px;
      color: #22c55e;
    }

    .subtitle {
      font-size: 16px;
      font-weight: 400;
      color: #6b7280;
      letter-spacing: 3px;
      margin-top: 4px;
    }

    .instructions {
      margin-top: 40px;
      text-align: center;
      color: #666;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div>
    <div class="logo-container">
      <div class="logo">
        <h1 class="main-title">
          Green Electric
          <sup class="registered">®</sup>
        </h1>
        <p class="subtitle">INDUSTRIAL SUPPLY</p>
      </div>
    </div>

    <p class="instructions">
      右键点击 logo → "另存为图片" 或截图保存
    </p>
  </div>
</body>
</html>
